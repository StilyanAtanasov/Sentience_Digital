<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
  <defs>
    <!-- Subtle Background Glow -->
    <radialGradient id="sd-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f28c28" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2364aa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#fffdf7" stroke="#e6ded1" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="40" fill="url(#sd-glow)"/>

  <!-- Outer Aperture / Vision Bands (Digital Iris Rings) -->
  <path d="M 50 14 A 36 36 0 0 1 86 50" fill="none" stroke="#2364aa" stroke-width="3" stroke-linecap="round"/>
  <path d="M 86 50 A 36 36 0 0 1 50 86" fill="none" stroke="#f28c28" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 86 A 36 36 0 0 1 14 50" fill="none" stroke="#66727d" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>
  <path d="M 14 50 A 36 36 0 0 1 50 14" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round"/>

  <!-- Focal Target Lines (Vision Test Crosshair) -->
  <line x1="50" y1="22" x2="50" y2="30" stroke="#66727d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="70" x2="50" y2="78" stroke="#66727d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="50" x2="30" y2="50" stroke="#66727d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="50" x2="78" y2="50" stroke="#66727d" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Central Eye / Awareness Pupil -->
  <ellipse cx="50" cy="50" rx="16" ry="11" fill="none" stroke="#1f2933" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="6" fill="#f28c28"/>
  <circle cx="50" cy="50" r="2.5" fill="#2364aa"/>
  <circle cx="48" cy="48" r="1" fill="#ffffff"/>
</svg>
