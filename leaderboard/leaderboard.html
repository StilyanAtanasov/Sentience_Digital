<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentience Digital | Leaderboard</title>

    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />

    <link rel="stylesheet" href="../global/reset.css" />
    <link rel="stylesheet" href="../components/loader.css" />
    <link rel="stylesheet" href="leaderboard.css" />
  </head>
  <body>
    <main class="leaderboard-shell">
      <header class="leaderboard-header">
        <div class="brand-lockup">
          <div class="logo-slot" aria-label="Logo placeholder">
            <img src="/assets/logo.svg" alt="Logo" />
          </div>
          <div>
            <p class="eyebrow">Sentience Digital</p>
            <h1>Leaderboard</h1>
          </div>
        </div>
        <a href="../identity/identity" class="take-test-cta"
          >Take the Test &rarr;</a
        >
      </header>

      <p class="header-note">Top 100 results</p>

      <section class="leaderboard-panel" aria-live="polite">
        <div class="table-heading">
          <span>Player</span>
          <span>Score</span>
        </div>
        <p id="leaderboardStatus" class="leaderboard-status">
          Loading results...
        </p>
        <ul id="leaderboardPlayersBox"></ul>
      </section>
    </main>
    <section id="loaderBox" class="loaderBox" aria-label="Loading leaderboard">
      <div class="loader"></div>
    </section>
    <script type="module" src="leaderboard.js"></script>
  </body>
</html>
