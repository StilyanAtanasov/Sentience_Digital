<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentience Digital | Enter</title>

    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../global/reset.css" />
    <link rel="stylesheet" href="../components/loader.css" />
    <link rel="stylesheet" href="identity.css" />

    <script defer src="../JS/identity.js" type="module"></script>
  </head>
  <body>
    <!-- 
      This HTML file contains the logic for our identity page.
      It allows users to sign up by providing their username only, which is used to display their submitted results later on.
      The form includes client-side validation to ensure that the username is not offensive or sensitive.
      Upon successful validation, the user is redirected to the main page.
    -->

    <main>
      <section class="container">
        <div class="brand-lockup">
          <div class="logo-slot" aria-label="Logo placeholder">
            <img src="/assets/logo.svg" alt="Logo" />
          </div>
          <p class="eyebrow">Sentience Digital</p>
        </div>
        <h1 class="logo">Focus, then Begin.</h1>
        <form id="identityForm">
          <div class="form-group">
            <label for="username">How should we call you?</label>
            <!-- Request for the user's name-->
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Your name..."
              maxlength="40"
              autocomplete="nickname"
              required
            />
            <button class="submit" type="submit" aria-label="Submit username">
              <i class="fa-solid fa-check"></i>
            </button>
          </div>
          <p id="usernameStatus" class="username-status" aria-live="polite"></p>
          <p class="context">
            "Your name will be used to display your position in the
            leaderboard."
          </p>
          <a class="leaderboard-link" href="../leaderboard/leaderboard"
            ><i class="fa-solid fa-ranking-star"></i> Leaderboard</a
          >
        </form>
      </section>
    </main>

    <!-- Loader -->
    <section id="loaderBox" class="loaderBox">
      <div class="loader"></div>
    </section>

    <script src="../JS/loader.js"></script>
  </body>
</html>
